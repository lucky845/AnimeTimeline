name: PR Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q pull.py scripts/

      - name: Unit tests
        run: python -m pytest -q

      - name: Data corruption guard
        run: python scripts/check_data.py
