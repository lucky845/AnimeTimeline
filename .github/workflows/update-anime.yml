name: Anime Data Sync

on:
  schedule:
    - cron: "0 6 * * *" # 每天UTC时间6点运行（北京时间14点）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-anime:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate timestamps
        run: |
          echo "CURRENT_DATE=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "CURRENT_YEAR=$(date '+%Y')" >> $GITHUB_ENV
          echo "CURRENT_MONTH=$(date '+%m')" >> $GITHUB_ENV

      - name: Run scraper
        env:
          CONCURRENT_REQUESTS: 3
        run: |
          python -m animetimeline auto \
            --year ${{ env.CURRENT_YEAR }} \
            --month ${{ env.CURRENT_MONTH }}

      - name: Data corruption guard
        # 守卫失败 -> job 红，create-pull-request 不执行，坏数据进不了 main
        run: python scripts/check_data.py

      - name: Health report
        # 体检表写进 job summary；严重项让 job 红，避免"全绿但其实没数据"
        run: python scripts/health.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Auto update anime data (${{ env.CURRENT_DATE }})"
          title: "🤖 Auto Update (${{ env.CURRENT_YEAR }}-${{ env.CURRENT_MONTH }})"
          body: |
            ### 自动更新详情
            - 更新时间: ${{ env.CURRENT_DATE }}
            - 触发方式: ${{ github.event_name || 'schedule' }}
          branch: "auto-update/${{ env.CURRENT_DATE }}"
          base: main
          delete-branch: true
          labels: automerge

      - name: Enable Auto-Merge
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash
