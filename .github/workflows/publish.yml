name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: 包内不得含数据目录
        run: |
          if tar tzf dist/*.tar.gz | grep -q "data/"; then
            echo "::error::sdist 里混进了 data/，发布前必须排除"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # 手动触发只构建，不发布
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI 可信发布（OIDC），无需长期 token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
