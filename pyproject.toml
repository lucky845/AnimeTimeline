[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animetimeline"
version = "0.1.0"
description = "从 bangumi-data + bgm.tv 生成番剧播出日历（Markdown 年度表 + iCalendar 订阅）"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "lucky845" }]
keywords = ["bangumi", "anime", "calendar", "icalendar", "scraper"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Environment :: Console",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://animetimeline.lucky845.top"
Repository = "https://github.com/lucky845/AnimeTimeline"

[project.scripts]
animetimeline = "animetimeline.cli:main"

[tool.setuptools]
packages = ["animetimeline"]
license-files = ["LICENSE"]
